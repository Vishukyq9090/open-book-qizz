name: Professor Quiz Bot 24x7

on:
  schedule:
    - cron: '52 */5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: professor-quiz-bot-live
  cancel-in-progress: true

jobs:
  run-quiz-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install and Build
        run: npm install && npm run build
     - name: Run Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: "7412791600"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: timeout 19800s npm start || true
      - name: Auto Restart Next Session
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run quiz_bot.yml --repo ${{ github.repository }} || true
